name: Deploy to AWS EC2

# Declenchement manuel uniquement (bouton "Run workflow" dans l'onglet
# Actions) : on ne veut pas redeployer automatiquement l'infrastructure
# cloud a chaque push. Necessite les secrets de repo EC2_HOST et
# EC2_SSH_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd hadoop-pipeline
            git pull
            docker compose up -d --build
